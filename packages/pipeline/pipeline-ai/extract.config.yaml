# extract.config.yaml — pipeline-ai standalone package export
# RFC-0098: Publish pipeline SDK packages to NPM

projectDir: packages/pipeline/pipeline-ai
destName: pipeline-ai
standalone: true

workspacePrefixes:
  - "@syrokomskyi/"
  - "@warpgogol/"
stripScopes:
  - "@syrokomskyi/"
  - "@warpgogol/"
  - "@wgogol/"
preservePackages:
  - "@warpgogol/pipeline-core"
packageManager: "pnpm"
ignoreDirs:
  - .output
  - .debug
  - .debug-public
  - .astro
  - spec
  - .agents

extraGitignore:
  - .output
  - .debug
  - .debug-public

postProcess:
  - action: delete
    path: AGENTS.md

git:
  remote: git@github.com:syrokomskyi/pipeline-ai.git
  autoPush: true

skipSecretScan: true
